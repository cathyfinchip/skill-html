<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <style>

    :root {
      --bg: #f6f7f9;
      --ink: #18202a;
      --muted: #627084;
      --line: #dce2ea;
      --panel: #ffffff;
      --accent: #0b6bcb;
      --accent-soft: #e7f1fd;
      --risk: #9f3a20;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.55;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .shell { max-width: 1180px; margin: 0 auto; padding: 28px 20px 56px; }
    .hero {
      display: grid;
      gap: 16px;
      padding: 28px 0 18px;
      border-bottom: 1px solid var(--line);
    }
    .hero h1 { margin: 0; font-size: 34px; line-height: 1.1; letter-spacing: 0; }
    .hero p { margin: 0; max-width: 820px; color: var(--muted); }
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; }
    button {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      padding: 9px 12px;
      border-radius: 6px;
      cursor: pointer;
    }
    .badges, .meta { display: flex; gap: 8px; flex-wrap: wrap; }
    .pill {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--line);
      background: var(--accent-soft);
      color: #164f8f;
      border-radius: 999px;
      padding: 3px 9px;
      font-size: 12px;
      font-weight: 650;
      max-width: 100%;
      white-space: nowrap;
      overflow-wrap: normal;
      word-break: normal;
    }
    .pill.long-pill {
      display: inline-block;
      flex-basis: 100%;
      white-space: normal;
      line-height: 1.45;
      border-radius: 8px;
      padding: 7px 10px;
    }
    .meta .pill.long-pill {
      flex-basis: auto;
      max-width: 100%;
    }
    .band { padding: 28px 0; border-bottom: 1px solid var(--line); }
    .section-head { display: flex; justify-content: space-between; gap: 16px; align-items: end; margin-bottom: 16px; }
    .section-head h2 { margin: 0; font-size: 22px; letter-spacing: 0; }
    .section-head p { margin: 0; color: var(--muted); max-width: 680px; }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    .grid > *,
    .product-card,
    .card-body,
    .details,
    .detail-row,
    .detail-row strong {
      min-width: 0;
    }
    .product-card, .original {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }
    .product-card { display: grid; grid-template-rows: auto 1fr; }
    .original { display: grid; grid-template-columns: 260px 1fr; gap: 18px; padding: 14px; }
    .image-wrap { background: #eef2f6; height: 210px; width: 100%; display: grid; place-items: center; overflow: hidden; }
    .product-image { width: 100%; height: 100%; max-width: 100%; max-height: 100%; object-fit: contain; object-position: center; background: #fff; }
    .image-note {
      align-self: end;
      justify-self: stretch;
      padding: 5px 8px;
      background: rgba(24, 32, 42, .72);
      color: #fff;
      font-size: 11px;
      text-align: center;
    }
    .image-placeholder {
      width: 100%;
      height: 210px;
      display: grid;
      place-items: center;
      padding: 20px;
      color: var(--muted);
      font-size: 13px;
      border: 1px dashed #b8c4d2;
      background: repeating-linear-gradient(45deg, #f8fafc, #f8fafc 10px, #eef2f6 10px, #eef2f6 20px);
    }
    .card-body { padding: 14px; display: grid; gap: 10px; align-content: start; }
    .card-body h3, .original h3 { margin: 0; font-size: 17px; line-height: 1.3; letter-spacing: 0; }
    .details { display: grid; gap: 6px; }
    .detail-row { display: grid; grid-template-columns: 112px 1fr; gap: 10px; font-size: 13px; }
    .detail-row span { color: var(--muted); }
    .detail-row strong {
      font-weight: 600;
      overflow-wrap: anywhere;
      word-break: break-word;
      max-width: 100%;
    }
    .card-link { margin-top: 4px; }
    .card-link,
    .link-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .link-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 30px;
      border-radius: 7px;
      padding: 5px 10px;
      border: 1px solid #bfd8ff;
      background: #e8f1ff;
      color: #1457a8;
      font-size: 12px;
      font-weight: 760;
      line-height: 1.2;
      text-decoration: none;
    }
    .link-chip:hover { text-decoration: none; filter: brightness(.98); }
    .link-chip.source {
      border-color: #a9ddd4;
      background: #e3f7f4;
      color: #006b68;
    }
    .link-chip.alternative {
      border-color: #b7e7c9;
      background: #e8f8ef;
      color: #08713f;
    }
    .link-status {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      border-radius: 6px;
      padding: 3px 8px;
      background: #eef3f8;
      color: #506176;
      font-weight: 650;
      line-height: 1.35;
    }
    .table-wrap { overflow: hidden; max-width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th, td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; font-size: 13px; overflow-wrap: anywhere; word-break: break-word; }
    td a, td code { overflow-wrap: anywhere; word-break: break-word; }
    th { background: #f0f4f8; font-size: 12px; text-transform: uppercase; letter-spacing: .02em; color: var(--muted); }
    .muted { color: var(--muted); }
    .notes { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; }
    .focus-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-top: 2px;
    }
    .focus-legend span,
    .mark-platform,
    .mark-money,
    .mark-margin,
    .mark-source,
    .mark-search,
    .mark-risk,
    .mark-caution {
      display: inline;
      border-radius: 5px;
      padding: 1px 4px;
      font-weight: 760;
      overflow-wrap: anywhere;
      word-break: break-word;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }
    .focus-legend span {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      font-size: 12px;
      border: 1px solid transparent;
      padding: 3px 8px;
    }
    .legend-platform,
    .mark-platform {
      color: #1457a8;
      background: #e8f1ff;
      border-color: #bfd8ff;
    }
    .legend-money,
    .mark-money,
    .mark-margin {
      color: #08713f;
      background: #e8f8ef;
      border-color: #b7e7c9;
    }
    .legend-source,
    .mark-source,
    .mark-search {
      color: #006b68;
      background: #e3f7f4;
      border-color: #b5e5de;
    }
    .legend-risk,
    .mark-risk,
    .mark-caution {
      color: #a33b17;
      background: #fff0e7;
      border-color: #ffd0b7;
    }
    .mark-caution {
      color: #8a1f11;
      background: #ffe9e7;
    }
    .row-margin,
    .row-price,
    .row-reason,
    .row-risk {
      border-radius: 6px;
      padding: 4px 6px;
      margin: -4px 0;
    }
    .row-margin { background: linear-gradient(90deg, rgba(15, 154, 89, .11), transparent 78%); }
    .row-price { background: linear-gradient(90deg, rgba(11, 107, 203, .09), transparent 78%); }
    .row-reason { background: linear-gradient(90deg, rgba(0, 107, 104, .09), transparent 78%); }
    .row-risk { background: linear-gradient(90deg, rgba(163, 59, 23, .12), transparent 82%); }
    .row-margin > span,
    .row-price > span,
    .row-reason > span,
    .row-risk > span {
      font-weight: 750;
    }
    .row-margin > span { color: #08713f; }
    .row-price > span { color: #1457a8; }
    .row-reason > span { color: #006b68; }
    .row-risk > span { color: #a33b17; }
    .notes li {
      margin: 8px 0;
    }
    @media (max-width: 900px) {
      .grid { grid-template-columns: 1fr; }
      .original { grid-template-columns: 1fr; }
      .hero h1 { font-size: 28px; }
    }
    @media print {
      body { background: #fff; }
      .shell { max-width: none; padding: 0; }
      .toolbar { display: none; }
      .band { break-inside: avoid; }
      a { color: #000; text-decoration: underline; }
      .mark-platform,
      .mark-money,
      .mark-margin,
      .mark-source,
      .mark-search,
      .mark-risk,
      .mark-caution {
        color: #000;
        border: 1px solid #ddd;
        background: #f7f7f7;
      }
    }
  
.image-wrap svg{display:block;width:100%;height:100%;max-height:280px}.product-card .image-wrap{height:260px}.shell{width:100%;background:#f6f7f9;color:#18202a}.detail-row strong{font-weight:500;overflow-wrap:anywhere}.notes li{overflow-wrap:anywhere}@media(max-width:640px){.hero h1{font-size:28px}.shell{padding:16px}.original{grid-template-columns:1fr}}
</style>
</head>
<body>
  <main class="shell">
    <header class="hero">
      
      <h1>{{title}}</h1>
      <div class="meta">{{hero_meta}}</div>
      <p>{{summary_html}}</p>
      
    </header>
    {{original_block}}
    {{exact_section}}
    {{alternatives_section}}
    {{category_sections}}{{inquiry_section}}
    <section class="band">
      <div class="section-head"><h2>风险与备注</h2></div>
      <div class="notes"><ul>{{note_items}}</ul></div>
    </section>
    <section class="band">
      <div class="section-head"><h2>参考来源</h2></div>
      <div class="notes"><ul>{{source_items}}</ul></div>
    </section>
    
  </main>
</body>
</html>
